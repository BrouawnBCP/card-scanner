<meta charset="utf-8">
<title>Scanner Yu-Gi-Oh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one mobile column — sticky capture bar on top, scanned cards as a ledger below, export at the end. */
:root{
  --bg:#eef0f5; --surface:#ffffff; --sunk:#f5f6f9; --ink:#141824; --muted:#5b6377; --line:#d7dbe5;
  --accent:#8a6417; --accent-strong:#b8862b; --accent-ink:#ffffff; --accent-soft:#f6ecd7;
  --ok:#1f7a4d; --ok-soft:#e1f2e9; --warn:#a85a08; --warn-soft:#fbecd9; --bad:#b3261e; --bad-soft:#fbe3e1;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f121a; --surface:#181c27; --sunk:#131722; --ink:#e9ecf3; --muted:#9aa2b6; --line:#2a3041;
  --accent:#e0b55a; --accent-strong:#d9a845; --accent-ink:#1a1405; --accent-soft:#2c2513;
  --ok:#55c993; --ok-soft:#14291f; --warn:#f0a24a; --warn-soft:#2e2112; --bad:#f17b70; --bad-soft:#321816;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f121a; --surface:#181c27; --sunk:#131722; --ink:#e9ecf3; --muted:#9aa2b6; --line:#2a3041;
  --accent:#e0b55a; --accent-strong:#d9a845; --accent-ink:#1a1405; --accent-soft:#2c2513;
  --ok:#55c993; --ok-soft:#14291f; --warn:#f0a24a; --warn-soft:#2e2112; --bad:#f17b70; --bad-soft:#321816;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 16px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-wrap:balance}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button,.btn{font:600 15px/1 var(--f-body);border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);padding:12px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
button:focus-visible,.btn:focus-within,input:focus-visible,select:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--accent-ink)}
.btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.btn{position:relative}
button:disabled{opacity:.5;cursor:default}
.manual{display:flex;gap:8px;margin-top:8px}
.manual input{flex:1;min-width:0}
input,select{font:500 15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px}
input.mono{font-family:var(--f-mono);text-transform:uppercase}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:12px;color:var(--muted);font-size:14px}
.notice.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.notice strong{color:var(--ink)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .glyph{font-family:var(--f-mono);font-size:22px;color:var(--accent);letter-spacing:.06em;margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:10px 12px}
.item.ok{border-left-color:var(--ok)} .item.check{border-left-color:var(--warn)} .item.unknown{border-left-color:var(--bad)} .item.pending{border-left-color:var(--accent-strong)}
.item.flash{animation:flash 1s ease}
@keyframes flash{from{background:var(--accent-soft)}to{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){.item.flash{animation:none}}
.thumb{width:64px;aspect-ratio:59/86;border-radius:4px;background:var(--sunk);object-fit:cover;max-width:100%;border:1px solid var(--line)}
.thumb{grid-column:1}
.body{grid-column:2;min-width:0;display:flex;flex-direction:column;gap:6px}
.name{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.code{font-family:var(--f-mono);font-size:13px;color:var(--accent);letter-spacing:.02em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row select,.row input{min-height:34px;padding:5px 8px;font-size:14px}
.row input.price{width:84px}
.row input.comment{width:110px}
.chip{font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--muted);min-height:34px}
.chip.on{background:var(--accent-soft);border-color:var(--accent-strong);color:var(--accent)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{min-height:34px;padding:0 10px;border:0;border-radius:0;background:var(--sunk);font-size:16px}
.qty span{min-width:30px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.del{margin-left:auto;min-height:34px;padding:0 10px;font-size:13px;color:var(--bad);background:transparent;border-color:transparent}
.flag{font-size:12px;font-weight:600;padding:3px 7px;border-radius:5px;display:inline-block}
.flag.warn{background:var(--warn-soft);color:var(--warn)} .flag.bad{background:var(--bad-soft);color:var(--bad)} .flag.ok{background:var(--ok-soft);color:var(--ok)} .flag.pend{background:var(--accent-soft);color:var(--accent)}
.fix{display:flex;gap:6px;flex-wrap:wrap}
.fix input{flex:1;min-width:120px}
.fix select{max-width:100%;flex:1 1 100%}
section.export{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
h2{font-family:var(--f-display);font-size:20px;margin:0;letter-spacing:.01em}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.settings label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.summary{font-size:14px;color:var(--muted)}
.exrow{display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;min-height:140px;font:12px/1.4 var(--f-mono);background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
</style>

<div class="wrap">
  <header class="bar">
    <div class="top">
      <h1>Scanner Yu-Gi-Oh</h1>
      <span class="count" id="count">0 carte</span>
    </div>
    <div class="actions">
      <label class="btn primary" id="shootLbl">Photographier
        <input type="file" id="shoot" accept="image/*" capture="environment">
      </label>
      <label class="btn" id="pickLbl">Importer des photos
        <input type="file" id="pick" accept="image/*" multiple>
      </label>
    </div>
    <form class="manual" id="manualForm">
      <input id="manualCode" class="mono" placeholder="Ou tape un code : MP20-FR167" autocomplete="off" aria-label="Code de set">
      <button type="submit">Ajouter</button>
    </form>
  </header>

  <div id="notices"></div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty">
    <div class="glyph">MP20-FR167</div>
    <div>Prends une carte en photo, de face, avec le code de set bien lisible.<br>Elle apparaît ici, prête pour l'export Cardmarket.</div>
  </div>

  <section class="export">
    <h2>Export Cardmarket</h2>
    <div class="settings">
      <label>État par défaut
        <select id="setCond">
          <option>MT</option><option selected>NM</option><option>EX</option><option>GD</option><option>LP</option><option>PL</option><option>PO</option>
        </select>
      </label>
      <label>Langue si code illisible
        <select id="setLang">
          <option>French</option><option>English</option><option>German</option><option>Italian</option><option>Spanish</option><option>Portuguese</option>
        </select>
      </label>
      <label>Commentaire par défaut
        <input id="setComment" placeholder="ex. CM40-01">
      </label>
      <label>Prix par défaut (€)
        <input id="setPrice" inputmode="decimal" placeholder="vide">
      </label>
    </div>
    <div class="summary" id="summary"></div>
    <div class="exrow">
      <button class="btn primary" id="exportBtn">Télécharger le CSV</button>
      <button id="copyBtn">Copier le CSV</button>
      <button id="clearBtn">Vider la liste</button>
    </div>
    <textarea id="csvOut" hidden readonly aria-label="CSV"></textarea>
  </section>
</div>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

const REGION = {FR:"French",F:"French",EN:"English",E:"English",DE:"German",G:"German",D:"German",IT:"Italian",I:"Italian",SP:"Spanish",S:"Spanish",ES:"Spanish",PT:"Portuguese",P:"Portuguese"};
const LANG_CODE = {French:"FR",English:"EN",German:"DE",Italian:"IT",Spanish:"SP",Portuguese:"PT"};
const LANG_SHORT = {French:"FR",English:"EN",German:"DE",Italian:"IT",Spanish:"ES",Portuguese:"PT"};

let DATA = null, nameIdx = null, cardKeys = null;
let sample = null, imagesOk = false, downloads = null;
const items = new Map();     // id -> item (persisted)
const pending = new Map();   // id -> {thumb, status}
let store = null;
let lastFlash = null;

// ---------- settings (per-viewer convenience) ----------
const SKEY = "ygo-scan-settings";
function loadSettings(){ try { return JSON.parse(localStorage.getItem(SKEY) || "{}"); } catch { return {}; } }
function saveSettings(){ try { localStorage.setItem(SKEY, JSON.stringify(settings())); } catch {} }
function settings(){ return { cond: $("setCond").value, lang: $("setLang").value, comment: $("setComment").value.trim(), price: $("setPrice").value.trim().replace(",", ".") }; }
(() => { const s = loadSettings(); if (s.cond) $("setCond").value = s.cond; if (s.lang) $("setLang").value = s.lang; if (s.comment) $("setComment").value = s.comment; if (s.price) $("setPrice").value = s.price; })();
["setCond","setLang","setComment","setPrice"].forEach((id) => $(id).addEventListener("change", saveSettings));

// ---------- card data ----------
function parseCode(raw){
  const c = String(raw || "").toUpperCase().replace(/\s+/g, "").replace(/[–—_]/g, "-");
  const m = c.match(/^([A-Z0-9]{2,6})-([A-Z]{0,2})(\d{1,4}[A-Z]?)$/);
  if (!m) return null;
  return { code: c, prefix: m[1], region: m[2], num: m[3], lang: REGION[m[2]] || (m[2] === "" ? null : null) };
}
function lookupKey(p){
  if (!DATA) return null;
  const tries = [p.num, p.num.padStart(3, "0"), p.num.replace(/^0+(?=\d)/, "").padStart(3, "0")];
  for (const n of tries){ const k = p.prefix + "-" + n; if (DATA.prints[k]) return k; }
  return null;
}
function candidatesFor(key){
  const seen = new Set(), out = [];
  for (const e of DATA.prints[key] || []){
    const id = e[0] + "|" + e[2];
    if (seen.has(id)) continue; seen.add(id);
    out.push({ card: e[0], set: DATA.sets[e[1]], rarity: e[2], cmId: e[3] || 0 });
  }
  return out;
}
const normR = (r) => String(r || "").toLowerCase().replace(/[^a-z]/g, "");
function pickCandidate(cands, aiRarity){
  if (cands.length === 1) return { c: cands[0], guessed: false };
  const a = normR(aiRarity);
  if (a){
    const exact = cands.find((c) => normR(c.rarity) === a);
    if (exact) return { c: exact, guessed: true };
    const loose = cands.find((c) => normR(c.rarity).includes(a) || a.includes(normR(c.rarity)));
    if (loose) return { c: loose, guessed: true };
  }
  return { c: null, guessed: false };
}
function buildNameIndex(){
  if (nameIdx) return;
  nameIdx = new Map(); cardKeys = new Map();
  DATA.cards.forEach((c, i) => { [c[0], c[1]].forEach((n) => { if (n) nameIdx.set(normName(n), i); }); });
  for (const [k, list] of Object.entries(DATA.prints)) for (const e of list){ if (!cardKeys.has(e[0])) cardKeys.set(e[0], new Set()); cardKeys.get(e[0]).add(k); }
}
function normName(n){ return String(n).toLowerCase().normalize("NFD").replace(/\p{M}/gu, "").replace(/[^a-z0-9]/g, ""); }
function suggestionsByName(name, prefixHint){
  if (!DATA || !name) return [];
  buildNameIndex();
  const i = nameIdx.get(normName(name));
  if (i == null) return [];
  let keys = [...(cardKeys.get(i) || [])];
  if (prefixHint){ const f = keys.filter((k) => k.startsWith(prefixHint + "-")); if (f.length) keys = f; }
  return keys.slice(0, 60).map((k) => { const e = DATA.prints[k].find((x) => x[0] === i) || DATA.prints[k][0]; return { key: k, label: k + " · " + DATA.sets[e[1]] }; });
}

// Fill an item from a printed code. Returns the patched item.
function resolveInto(item, rawCode, aiRarity){
  const p = parseCode(rawCode);
  item.code = p ? p.code : String(rawCode || "").toUpperCase();
  item.lang = (p && p.lang) || item.lang || settings().lang;
  const key = p && lookupKey(p);
  if (!key){
    item.status = "unknown"; item.key = ""; item.cands = []; item.rarity = ""; item.cmId = 0;
    item.suggest = suggestionsByName(item.nameFR || item.nameEN || item.aiName, p && p.prefix);
    return item;
  }
  const cands = candidatesFor(key);
  const { c, guessed } = pickCandidate(cands, aiRarity);
  item.key = key; item.prefix = key.split("-")[0]; item.cn = key.split("-")[1];
  item.cands = cands.map((x) => ({ rarity: x.rarity, set: x.set, cmId: x.cmId, card: x.card }));
  const base = c || cands[0];
  item.nameEN = DATA.cards[base.card][0]; item.nameFR = DATA.cards[base.card][1] || item.nameEN;
  item.set = base.set; item.suggest = [];
  if (c){ item.rarity = c.rarity; item.cmId = c.cmId; item.status = guessed ? "check" : "ok"; item.rarityGuessed = guessed; }
  else { item.rarity = ""; item.cmId = 0; item.status = "check"; item.rarityGuessed = false; }
  return item;
}
function applyRarity(item, rarity){
  const c = (item.cands || []).find((x) => x.rarity === rarity);
  if (!c) return;
  item.rarity = c.rarity; item.cmId = c.cmId; item.set = c.set; item.rarityGuessed = false;
  item.nameEN = DATA.cards[c.card][0]; item.nameFR = DATA.cards[c.card][1] || item.nameEN;
  item.status = "ok";
}

// ---------- storage: db when available, else this browser ----------
const LKEY = "ygo-scan-items";
function makeLocalStore(){
  let cb = () => {};
  const read = () => { try { return JSON.parse(localStorage.getItem(LKEY) || "[]"); } catch { return []; } };
  const write = () => { try { localStorage.setItem(LKEY, JSON.stringify([...items.values()])); } catch {} };
  return {
    kind: "local",
    subscribe(fn){ cb = fn; fn(read()); },
    async put(it){ items.set(it.id, it); write(); cb([...items.values()]); },
    async del(id){ items.delete(id); write(); cb([...items.values()]); },
  };
}
async function makeDbStore(){
  const db = await claude.use("db"); const user = await claude.use("user");
  if (!db || !user) return null;
  const me = await user.id();
  if (!me) return null;
  const col = db.collection("data/users/" + me + "/items");
  return {
    kind: "db",
    subscribe(fn){
      const t = setTimeout(() => notice("load", "La liste enregistrée met du temps à répondre. Les nouveaux scans restent possibles."), 10000);
      col.onSnapshot((snap) => { if (!snap.metadata.fromCache){ clearTimeout(t); clearNotice("load"); } fn(snap.docs.map((d) => ({ ...d.data(), id: d.id }))); },
                     () => { clearTimeout(t); notice("load", "Impossible de joindre la liste enregistrée. Exporte avant de fermer la page."); });
    },
    async put(it){ const { id, ...body } = it; await col.doc(id).set(JSON.parse(JSON.stringify(body))); },
    async del(id){ await col.doc(id).delete(); },
  };
}
function onItems(list){
  items.clear(); for (const it of list) items.set(it.id, it);
  render();
}

// ---------- notices ----------
const notices = new Map();
function notice(k, html, warn = true){ notices.set(k, { html, warn }); drawNotices(); }
function clearNotice(k){ notices.delete(k); drawNotices(); }
function drawNotices(){ $("notices").innerHTML = [...notices.values()].map((n) => `<div class="notice ${n.warn ? "warn" : ""}">${n.html}</div>`).join(""); }
let toastT;
function toast(msg){ let t = document.querySelector(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.append(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600); }

// ---------- images ----------
async function thumbOf(file){
  try {
    const bmp = await createImageBitmap(file);
    const w = 150, h = Math.round(bmp.height * (w / bmp.width));
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
    return cv.toDataURL("image/jpeg", 0.7);
  } catch { return ""; }
}

// ---------- recognition ----------
const PROMPT = `You are reading photos of Yu-Gi-Oh! trading cards (usually French prints) for a Cardmarket stock list.
The photo shows ONE card, or occasionally several. For EACH card visible, report:
- "code": the set code printed just below the artwork on the right (e.g. "MP20-FR167", "OP25-FR019", "LOB-F001"). Copy it character by character. If a character is unreadable, write "?" for it. Never invent a code from memory.
- "name": the card name exactly as printed.
- "first_edition": true only if "1st Edition" / "1re Édition" / "1. Auflage" is printed next to the 8-digit passcode, bottom left.
- "rarity": your best guess from the finish, one of: Common, Rare, Super Rare, Ultra Rare, Secret Rare, Prismatic Secret Rare, Ultimate Rare, Quarter Century Secret Rare, Starlight Rare, Platinum Secret Rare, Collectors Rare, Ghost Rare, Gold Rare, Premium Gold Rare, Starfoil Rare, Mosaic Rare, Shatterfoil Rare.
  Cues: Common = plain name, flat artwork. Rare = silver foil name, flat artwork. Super Rare = plain name, holographic artwork. Ultra Rare = gold foil name, holographic artwork. Secret Rare = rainbow/sparkly name and diagonal-sparkle artwork. Prismatic Secret Rare = sparkly name with dotted/prismatic artwork texture. Ultimate Rare = embossed name, artwork border and level stars. Collectors Rare = textured, iridescent artwork and name.
- "code_sure": true if you could read every character of the code clearly.
Reply with only JSON: {"cards":[{"code":"MP20-FR167","name":"Galant Granite","first_edition":true,"rarity":"Prismatic Secret Rare","code_sure":true}]}
If no card is visible, reply {"cards":[]}.`;

const queue = [];
let running = 0;
function enqueue(file){
  const pid = uid();
  pending.set(pid, { thumb: "", status: "En attente…" });
  thumbOf(file).then((t) => { const p = pending.get(pid); if (p){ p.thumb = t; render(); } });
  queue.push({ pid, file });
  render(); pump();
}
function pump(){
  while (running < 2 && queue.length){
    const job = queue.shift(); running++;
    analyse(job).finally(() => { running--; pump(); });
  }
}
async function analyse({ pid, file }){
  const p = pending.get(pid); p.status = "Lecture de la carte…"; render();
  let res;
  try {
    res = await sample.json(PROMPT, { images: [file], cache: false });
  } catch (e) {
    pending.delete(pid);
    const msg = {
      not_granted: "La lecture des photos par Claude a été refusée. Tu peux encore taper les codes à la main.",
      sampling_disabled: "Claude n'est pas disponible pour ce compte. Tu peux encore taper les codes à la main.",
      rate_limited: "Trop de photos d'un coup ou limite d'utilisation atteinte. Attends un peu puis réessaie.",
      image_rejected: "Cette photo n'a pas été acceptée (format ou taille). Reprends-la.",
      invalid_json: "La réponse n'a pas pu être lue. Reprends la photo.",
      images_unavailable: "L'envoi de photos n'est pas disponible ici. Tape les codes à la main.",
    }[e && e.code] || "La lecture a échoué. Reprends la photo.";
    toast(msg); render(); return;
  }
  const cards = Array.isArray(res && res.cards) ? res.cards : [];
  pending.delete(pid);
  if (!cards.length){ toast("Aucune carte reconnue sur cette photo."); render(); return; }
  for (const c of cards){
    const item = newItem({ thumb: p.thumb, aiName: String(c.name || ""), firstEd: !!c.first_edition, aiRarity: String(c.rarity || "") });
    item.nameFR = item.aiName;
    resolveInto(item, String(c.code || ""), item.aiRarity);
    if (item.status === "ok" && c.code_sure === false) item.status = "check";
    await addOrMerge(item);
  }
}
function newItem(extra){
  const s = settings();
  return { id: uid(), createdAt: Date.now(), qty: 1, condition: s.cond, comment: s.comment, price: s.price, lang: s.lang, firstEd: false, status: "unknown", code: "", key: "", cands: [], suggest: [], ...extra };
}
function mergeKey(it){ return [it.key, it.rarity, it.lang, it.firstEd, it.condition, it.comment, it.price].join("|"); }
async function addOrMerge(item){
  if (item.status === "ok"){
    const twin = [...items.values()].find((x) => x.status === "ok" && mergeKey(x) === mergeKey(item));
    if (twin){ const t = { ...twin, qty: (twin.qty || 1) + 1 }; lastFlash = t.id; await save(t); toast(`${t.nameFR} : ${t.qty} exemplaires`); return; }
  }
  lastFlash = item.id;
  await save(item);
}
async function save(it){ try { await store.put(it); } catch { toast("L'enregistrement a échoué. Exporte ta liste par sécurité."); } }

// ---------- rendering ----------
const COND = ["MT","NM","EX","GD","LP","PL","PO"];
function render(){
  const all = [...items.values()].sort((a, b) => b.createdAt - a.createdAt);
  const total = all.reduce((n, x) => n + (x.qty || 1), 0);
  $("count").textContent = `${total} carte${total > 1 ? "s" : ""}` + (pending.size ? ` · ${pending.size} en lecture` : "");
  $("empty").hidden = all.length > 0 || pending.size > 0;
  const pend = [...pending.entries()].map(([id, p]) => `
    <div class="item pending"><img class="thumb" alt="" src="${esc(p.thumb)}" ${p.thumb ? "" : "hidden"}>
      <div class="body"><span class="flag pend">${esc(p.status)}</span></div></div>`).join("");
  $("list").innerHTML = pend + all.map(rowHtml).join("");
  if (lastFlash){ const el = $("list").querySelector(`[data-id="${lastFlash}"]`); if (el) el.classList.add("flash"); lastFlash = null; }
  summary();
}
function rowHtml(it){
  const flag = it.status === "unknown" ? `<span class="flag bad">Code introuvable</span>`
    : !it.rarity ? `<span class="flag warn">Choisis la rareté</span>`
    : it.status === "check" ? `<span class="flag warn">${it.rarityGuessed ? "Rareté devinée, vérifie" : "Code peu lisible, vérifie"}</span>`
    : "";
  const rarSel = (it.cands || []).length > 1
    ? `<select data-act="rarity" aria-label="Rareté">${it.rarity ? "" : `<option value="">Rareté ?</option>`}${it.cands.map((c) => `<option ${c.rarity === it.rarity ? "selected" : ""}>${esc(c.rarity)}</option>`).join("")}</select>`
    : `<span class="chip on">${esc(it.rarity || "?")}</span>`;
  const known = it.status !== "unknown";
  const fix = known ? "" : `
    <div class="fix">
      <input class="mono" data-act="codeinput" value="${esc(it.code)}" aria-label="Corriger le code" placeholder="MP20-FR167">
      <button data-act="recode">Valider</button>
      ${it.suggest && it.suggest.length ? `<select data-act="suggest" aria-label="Versions connues"><option value="">${it.suggest.length} version(s) de « ${esc(it.nameFR || it.aiName)} »…</option>${it.suggest.map((s) => `<option value="${esc(s.key)}">${esc(s.label)}</option>`).join("")}</select>` : ""}
    </div>`;
  return `
  <div class="item ${it.status}" data-id="${it.id}">
    <img class="thumb" alt="" src="${esc(it.thumb || "")}" ${it.thumb ? "" : "hidden"}>
    <div class="body">
      <div class="name">${esc(it.nameFR || it.aiName || "Carte inconnue")}</div>
      <div class="sub"><span class="code">${esc(it.code || "—")}</span>${it.set ? " · " + esc(it.set) : ""}${it.cmId ? "" : known ? " · nouvel article" : ""}</div>
      ${flag ? `<div>${flag}</div>` : ""}
      ${fix}
      ${known ? `<div class="row">
        ${rarSel}
        <button class="chip ${it.firstEd ? "on" : ""}" data-act="ed" aria-pressed="${it.firstEd}">1re éd.</button>
        <select data-act="cond" aria-label="État">${COND.map((c) => `<option ${c === it.condition ? "selected" : ""}>${c}</option>`).join("")}</select>
        <select data-act="lang" aria-label="Langue">${Object.keys(LANG_CODE).map((l) => `<option value="${l}" ${l === it.lang ? "selected" : ""}>${LANG_SHORT[l]}</option>`).join("")}</select>
      </div>
      <div class="row">
        <span class="qty"><button data-act="minus" aria-label="Retirer un exemplaire">−</button><span>${it.qty || 1}</span><button data-act="plus" aria-label="Ajouter un exemplaire">+</button></span>
        <input class="price" data-act="price" inputmode="decimal" placeholder="Prix €" value="${esc(it.price || "")}" aria-label="Prix">
        <input class="comment" data-act="comment" placeholder="Commentaire" value="${esc(it.comment || "")}" aria-label="Commentaire">
        <button class="del" data-act="del">Supprimer</button>
      </div>` : `<div class="row"><button class="del" data-act="del">Supprimer</button></div>`}
    </div>
  </div>`;
}

// ---------- row interactions ----------
function itemOf(el){ const row = el.closest("[data-id]"); return row && items.get(row.dataset.id); }
$("list").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-act]"); if (!b) return;
  const it = itemOf(b); if (!it) return;
  const x = JSON.parse(JSON.stringify(it));
  switch (b.dataset.act){
    case "plus": x.qty = (x.qty || 1) + 1; break;
    case "minus": if ((x.qty || 1) <= 1) return; x.qty -= 1; break;
    case "ed": x.firstEd = !x.firstEd; break;
    case "del": try { await store.del(x.id); } catch { toast("Suppression impossible pour l'instant."); } return;
    case "recode": {
      const v = b.parentElement.querySelector("[data-act=codeinput]").value;
      resolveInto(x, v, x.aiRarity);
      if (x.status === "unknown") toast("Ce code n'existe pas dans la base. Vérifie les lettres et chiffres.");
      break;
    }
    default: return;
  }
  await save(x);
});
$("list").addEventListener("change", async (ev) => {
  const el = ev.target; const act = el.dataset.act; const it = itemOf(el); if (!it || !act) return;
  const x = JSON.parse(JSON.stringify(it));
  if (act === "rarity") applyRarity(x, el.value);
  else if (act === "cond") x.condition = el.value;
  else if (act === "lang") x.lang = el.value;
  else if (act === "price") x.price = el.value.trim().replace(",", ".");
  else if (act === "comment") x.comment = el.value.trim();
  else if (act === "suggest"){
    if (!el.value) return;
    const [pre, num] = el.value.split("-");
    resolveInto(x, `${pre}-${LANG_CODE[x.lang] || "FR"}${num}`, x.aiRarity);
  } else return;
  await save(x);
});

// ---------- capture ----------
function handleFiles(files){
  if (!DATA){ toast("La base de cartes charge encore, une seconde…"); return; }
  if (!sample || !imagesOk){ toast("La lecture des photos n'est pas disponible ici. Tape le code à la main."); return; }
  for (const f of files) enqueue(f);
}
$("shoot").addEventListener("change", (e) => { handleFiles([...e.target.files]); e.target.value = ""; });
$("pick").addEventListener("change", (e) => { handleFiles([...e.target.files]); e.target.value = ""; });
$("manualForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!DATA) return;
  const v = $("manualCode").value.trim(); if (!v) return;
  const item = resolveInto(newItem({}), v, "");
  if (item.status === "unknown"){ toast("Code introuvable. Format attendu : MP20-FR167"); return; }
  $("manualCode").value = "";
  await addOrMerge(item);
});

// ---------- export ----------
const HEAD = ["cardmarketId","quantity","name","set","setCode","cn","condition","language","isFirstEd","isSigned","price","comment","nameDE","nameES","nameFR","nameIT","rarity","listedAt"];
const q = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
function exportable(){ return [...items.values()].filter((x) => x.status !== "unknown" && x.rarity); }
function buildCsv(){
  const merged = new Map();
  for (const it of exportable()){
    const k = [it.cmId || it.key, it.rarity, it.lang, it.firstEd, it.condition, it.price, it.comment].join("|");
    const m = merged.get(k); if (m) m.qty += it.qty || 1; else merged.set(k, { ...it, qty: it.qty || 1 });
  }
  const lines = [HEAD.map(q).join(",")];
  for (const it of merged.values()){
    lines.push([it.cmId || "", it.qty, it.nameEN, it.set, it.prefix, it.cn, it.condition, it.lang, it.firstEd ? "true" : "", "", it.price || "", it.comment || "", "", "", it.nameFR || "", "", it.rarity, ""].map(q).join(","));
  }
  return { csv: lines.join("\r\n") + "\r\n", count: merged.size };
}
function summary(){
  const all = [...items.values()];
  const ok = exportable(), bad = all.length - ok.length, noId = ok.filter((x) => !x.cmId).length;
  const parts = [`${ok.length} ligne${ok.length > 1 ? "s" : ""} prête${ok.length > 1 ? "s" : ""}`];
  if (bad) parts.push(`${bad} à corriger (exclue${bad > 1 ? "s" : ""} de l'export)`);
  if (noId) parts.push(`${noId} sans identifiant Cardmarket (cartes absentes de ton stock actuel)`);
  $("summary").textContent = parts.join(" · ");
}
$("exportBtn").addEventListener("click", async () => {
  const { csv, count } = buildCsv();
  if (!count){ toast("Rien à exporter pour l'instant."); return; }
  const d = new Date(); const stamp = d.toISOString().slice(0, 16).replace(/[:T]/g, "-");
  if (downloads){
    try { await downloads.save({ filename: `scan-cardmarket-${stamp}.csv`, data: "﻿" + csv }); toast("CSV téléchargé."); return; }
    catch (e) { if (e && e.code === "declined") return; }
  }
  $("csvOut").value = csv; $("csvOut").hidden = false; $("csvOut").select();
  toast("Téléchargement indisponible ici : copie le CSV ci-dessous.");
});
$("copyBtn").addEventListener("click", () => {
  const { csv, count } = buildCsv(); if (!count){ toast("Rien à copier pour l'instant."); return; }
  $("csvOut").value = csv; $("csvOut").hidden = false;
  navigator.clipboard.writeText(csv).then(() => toast("CSV copié."), () => { $("csvOut").select(); toast("Sélectionne le texte et copie-le."); });
});
let clearArmed = 0;
$("clearBtn").addEventListener("click", async () => {
  const b = $("clearBtn");
  if (Date.now() - clearArmed > 4000){ clearArmed = Date.now(); b.textContent = "Confirmer : tout effacer ?"; setTimeout(() => { b.textContent = "Vider la liste"; }, 4000); return; }
  clearArmed = 0; b.textContent = "Vider la liste";
  for (const id of [...items.keys()]){ try { await store.del(id); } catch {} }
  toast("Liste vidée.");
});

// ---------- boot ----------
render();
notice("data", "Chargement de la base de cartes…", false);
setTimeout(() => {
  try { DATA = JSON.parse(document.getElementById("cards-data").textContent); clearNotice("data"); render(); }
  catch { notice("data", "La base de cartes n'a pas pu être lue. Recharge la page."); }
}, 0);

(async () => {
  if (!window.claude){ store = makeLocalStore(); store.subscribe(onItems); notice("ai", "<strong>Lecture des photos indisponible.</strong> Ouvre cette page dans claude.ai pour scanner. Tu peux taper les codes à la main."); return; }
  const [s, dl, dbStore] = await Promise.all([claude.use("sample"), claude.use("downloads"), makeDbStore().catch(() => null)]);
  sample = s; downloads = dl;
  store = dbStore || makeLocalStore();
  store.subscribe(onItems);
  if (store.kind === "local") notice("store", "Ta liste est gardée seulement dans ce navigateur. Exporte-la avant de changer d'appareil.", false);
  if (sample){
    const lim = await sample.limits().catch(() => null);
    imagesOk = !!(lim && lim.images);
  }
  if (!sample || !imagesOk){
    notice("ai", "<strong>Lecture des photos indisponible ici.</strong> Ouvre la page dans claude.ai (navigateur du téléphone) pour scanner. Tu peux taper les codes à la main.");
    $("shootLbl").setAttribute("aria-disabled", "true"); $("pickLbl").setAttribute("aria-disabled", "true");
  }
})();
})();
</script>
